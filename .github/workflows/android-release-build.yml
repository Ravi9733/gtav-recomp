name: Android release shell APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-original-smooth-save
    paths:
      - ".github/workflows/android-release-build.yml"
      - "gtav/**"
      - "tools/android/**"
      - "rexglue-sdk-gtav-linux.patch"
      - "sdl3-gtav.patch"
      - "plume-gtav.patch"
      - "loader/**"

permissions:
  contents: read

jobs:
  build-release-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          sdkmanager "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang-18 g++-13 zip unzip openjdk-17-jdk python3 python3-pip libx11-xcb-dev libwayland-dev

      - name: Verify Clang with GCC 13 C++23 library
        shell: bash
        run: |
          set -euxo pipefail
          clang++-18 --version
          g++-13 --version
          cat > /tmp/cxx23-check.cpp <<'EOF'
          #include <expected>
          #include <charconv>
          #include <cfenv>
          int main() {
            std::expected<int, int> value = 1;
            float f = 1.25f;
            double d = 2.5;
            const char* s = "3.5";
            std::from_chars(s, s + 3, f, std::chars_format::general);
            std::from_chars(s, s + 3, d, std::chars_format::general);
            return *value;
          }
          EOF
          clang++-18 --gcc-toolchain=/usr -stdlib=libstdc++ -std=c++23 -fsyntax-only /tmp/cxx23-check.cpp

      - name: Checkout and patch ReXGlue SDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch v0.10.0 --depth 1 --recurse-submodules https://github.com/rexglue/rexglue-sdk.git rexglue-sdk
          git -C rexglue-sdk apply --check ../rexglue-sdk-gtav-linux.patch
          git -C rexglue-sdk apply ../rexglue-sdk-gtav-linux.patch
          (
            cd rexglue-sdk/thirdparty/sdl3
            git apply --check ../../../sdl3-gtav.patch
            git apply ../../../sdl3-gtav.patch
          )

      - name: Build host ReXGlue code generator
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S rexglue-sdk -B rexglue-sdk/out/build/linux-amd64 -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_C_FLAGS="--gcc-toolchain=/usr -mssse3" \
            -DCMAKE_CXX_FLAGS="--gcc-toolchain=/usr -stdlib=libstdc++ -mssse3" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/rexglue-sdk/out/install/linux-amd64" \
            -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_BUILD_TESTS=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF
          cmake --build rexglue-sdk/out/build/linux-amd64 --parallel 2
          cmake --install rexglue-sdk/out/build/linux-amd64
          test -x rexglue-sdk/out/install/linux-amd64/bin/rexglue

      - name: Build and install Android arm64 runtime
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S rexglue-sdk -B rexglue-sdk/out/build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+lse+rcpc+dotprod" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+lse+rcpc+dotprod -fno-semantic-interposition" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-Bsymbolic-functions" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/rexglue-sdk/out/install/android-arm64" \
            -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_BUILD_TESTS=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF
          cmake --build rexglue-sdk/out/build/android-arm64 --parallel 2
          cmake --install rexglue-sdk/out/build/android-arm64
          test -s rexglue-sdk/out/install/android-arm64/lib/librexruntime.so
          test -s rexglue-sdk/out/install/android-arm64/lib/librexgpu-xenos.so

      - name: Configure and build Android release game shell
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S gtav -B build/android-dll -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="$GITHUB_WORKSPACE/rexglue-sdk/out/install/android-arm64" \
            -Drexglue_DIR="$GITHUB_WORKSPACE/rexglue-sdk/out/install/android-arm64/lib/cmake/rexglue" \
            -DSDL3_DIR="$GITHUB_WORKSPACE/rexglue-sdk/out/install/android-arm64/lib/cmake/SDL3" \
            -DGTAV_GAME_DLL=ON -DCMAKE_FIND_PACKAGE_NO_PACKAGE_REGISTRY=ON
          cmake --build build/android-dll --parallel 2
          test -s build/android-dll/libmain.so
          test -s build/android-dll/libgtav_fast.so
          test -s build/android-dll/libgtav_setup.so

      - name: Package and verify release APK
        shell: bash
        run: |
          set -euxo pipefail
          RELEASE=1 tools/android/build_apk.sh
          APK=build/android/apk/gtav-recomp-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a/)?(libmain|libgtav_fast|libgtav_setup|librexruntime|librexgpu-xenos|libc\\+\\+_shared)\\.so'

      - name: Upload release shell APK
        uses: actions/upload-artifact@v4
        with:
          name: gtav-recomp-android-arm64-release-shell
          path: build/android/apk/gtav-recomp-release.apk
          if-no-files-found: error
          retention-days: 7
